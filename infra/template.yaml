AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AI Timeline API - Secure serverless backend with rate limiting and comment moderation

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment

  # Rate limiting configuration
  ThrottlingRateLimit:
    Type: Number
    Default: 100
    Description: Requests per second across all users

  ThrottlingBurstLimit:
    Type: Number
    Default: 200
    Description: Maximum concurrent requests allowed

  # VPC configuration for RDS access
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for Lambda functions to access RDS

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets for Lambda (at least 2 AZs for RDS)

  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group for Lambda functions (must allow outbound to RDS)

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs20.x
    MemorySize: 1024
    Environment:
      Variables:
        NODE_ENV: production

Resources:
  # ============================================
  # API Gateway with Rate Limiting
  # ============================================
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub ai-timeline-api-${Environment}
      StageName: !Ref Environment
      Description: AI Timeline API with rate limiting

      # CORS is handled by Express (not API Gateway) to support credentials
      # API Gateway CORS with '*' doesn't work when credentials: include is used

      # Rate limiting / Throttling
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingRateLimit: !Ref ThrottlingRateLimit
          ThrottlingBurstLimit: !Ref ThrottlingBurstLimit
          MetricsEnabled: true

      # NOTE: Access logging disabled - requires account-level CloudWatch role setup
      # To enable: set up API Gateway CloudWatch Logs role in AWS Console

  # ============================================
  # Lambda Function
  # ============================================
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ai-timeline-api-${Environment}
      Description: AI Timeline Express API
      CodeUri: ../server/src/
      Handler: lambda.handler
      ReservedConcurrentExecutions: 50

      # VPC configuration for RDS access
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
        SubnetIds: !Ref SubnetIds

      Environment:
        Variables:
          NODE_ENV: production
          # Database connection (from SSM Parameter Store)
          DATABASE_URL: !Sub '{{resolve:ssm:/ai-timeline/${Environment}/database-url}}'
          # Secrets from SSM Parameter Store (secure)
          JWT_SECRET: !Sub '{{resolve:ssm:/ai-timeline/${Environment}/jwt-secret}}'
          JWT_EXPIRES_IN: '24h'
          ADMIN_USERNAME: !Sub '{{resolve:ssm:/ai-timeline/${Environment}/admin-username}}'
          ADMIN_PASSWORD: !Sub '{{resolve:ssm:/ai-timeline/${Environment}/admin-password}}'
          ANTHROPIC_API_KEY: !Sub '{{resolve:ssm:/ai-timeline/${Environment}/anthropic-api-key}}'
          CORS_ORIGIN: !Sub '{{resolve:ssm:/ai-timeline/${Environment}/cors-origin}}'
          YOUTUBE_API_KEY: !Sub '{{resolve:ssm:/ai-timeline/${Environment}/youtube-api-key}}'
          PLAYWRIGHT_URL: !Sub '{{resolve:ssm:/ai-timeline/${Environment}/playwright-url}}'
          SEO_AGENT_PAUSED_PARAM: !Sub '/ai-timeline/${Environment}/seo-agent-paused'
          SEO_AGENT_LAST_RUN_PARAM: !Sub '/ai-timeline/${Environment}/seo-agent-last-run'
          SERPER_API_KEY_PARAM: !Sub '/ai-timeline/${Environment}/serper-api-key'
          SERPER_PRICING_PARAM: !Sub '/ai-timeline/${Environment}/serper-pricing-json'

      Events:
        ApiProxy:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /{proxy+}
            Method: ANY

        # Explicit OPTIONS handling to override API Gateway mock integrations
        ApiProxyOptions:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /{proxy+}
            Method: OPTIONS

        ApiRoot:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /
            Method: ANY

        ApiRootOptions:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /
            Method: OPTIONS

      # IAM permissions
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: '*'
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
                - ssm:PutParameter
              Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/ai-timeline/${Environment}/*'
            # CloudWatch Logs Insights for API monitoring
            - Effect: Allow
              Action:
                - logs:StartQuery
                - logs:GetQueryResults
                - logs:StopQuery
              Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/ai-timeline-api-${Environment}:*'
            # EC2 permissions for VPC networking (required for RDS access)
            - Effect: Allow
              Action:
                - ec2:CreateNetworkInterface
                - ec2:DescribeNetworkInterfaces
                - ec2:DeleteNetworkInterface
                - ec2:AssignPrivateIpAddresses
                - ec2:UnassignPrivateIpAddresses
              Resource: '*'
            # SES permissions for contact form emails
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: '*'
            # Lambda invoke permission for async analysis
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:ai-timeline-ingestion-${Environment}'
            # S3 permissions for Blog uploads (cover + inline images) and OG image generation
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource:
                - 'arn:aws:s3:::ai-timeline-frontend-1765916222/blog-uploads/*'
                - 'arn:aws:s3:::ai-timeline-frontend-1765916222/blog-og/*'

    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - lambda.ts
        External:
          - '@aws-sdk/*'

  # Lambda log group
  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/ai-timeline-api-${Environment}
      RetentionInDays: 30

  # ============================================
  # Ingestion Lambda Function (Sprint 32)
  # ============================================
  IngestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ai-timeline-ingestion-${Environment}
      Description: Scheduled ingestion job - fetches articles from news sources
      CodeUri: ../server/src/
      Handler: ingestionLambda.handler
      Timeout: 900  # 15 minutes - max Lambda timeout for bibliography ingestion
      ReservedConcurrentExecutions: 5
      MemorySize: 1024  # Increased for bibliography ingestion

      # VPC configuration for RDS access
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
        SubnetIds: !Ref SubnetIds

      Environment:
        Variables:
          NODE_ENV: production
          # Database connection (from SSM Parameter Store)
          DATABASE_URL: !Sub '{{resolve:ssm:/ai-timeline/${Environment}/database-url}}'
          # Secrets from SSM Parameter Store (secure)
          ANTHROPIC_API_KEY: !Sub '{{resolve:ssm:/ai-timeline/${Environment}/anthropic-api-key}}'
          YOUTUBE_API_KEY: !Sub '{{resolve:ssm:/ai-timeline/${Environment}/youtube-api-key}}'
          PLAYWRIGHT_URL: !Sub '{{resolve:ssm:/ai-timeline/${Environment}/playwright-url}}'
          SEO_AGENT_PAUSED_PARAM: !Sub '/ai-timeline/${Environment}/seo-agent-paused'
          SEO_AGENT_LAST_RUN_PARAM: !Sub '/ai-timeline/${Environment}/seo-agent-last-run'
          SERPER_API_KEY_PARAM: !Sub '/ai-timeline/${Environment}/serper-api-key'
          SERPER_PRICING_PARAM: !Sub '/ai-timeline/${Environment}/serper-pricing-json'

      # IAM permissions
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: '*'
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
                - ssm:PutParameter
              Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/ai-timeline/${Environment}/*'
            # EC2 permissions for VPC networking (required for RDS access)
            - Effect: Allow
              Action:
                - ec2:CreateNetworkInterface
                - ec2:DescribeNetworkInterfaces
                - ec2:DeleteNetworkInterface
                - ec2:AssignPrivateIpAddresses
                - ec2:UnassignPrivateIpAddresses
              Resource: '*'

    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - ingestionLambda.ts
        External:
          - '@aws-sdk/*'

  # Ingestion Lambda log group
  IngestionFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/ai-timeline-ingestion-${Environment}
      RetentionInDays: 30

  # ============================================
  # EventBridge Schedule (Sprint 32)
  # ============================================
  IngestionScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ai-timeline-ingestion-schedule-${Environment}
      Description: Triggers daily ingestion at midnight EST (5:00 AM UTC)
      # Midnight EST = 5:00 AM UTC (4:00 AM during daylight saving time)
      ScheduleExpression: "cron(0 5 * * ? *)"
      State: ENABLED
      Targets:
        - Id: IngestionLambdaTarget
          Arn: !GetAtt IngestionFunction.Arn

  # Permission for EventBridge to invoke the Lambda
  IngestionSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref IngestionFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt IngestionScheduleRule.Arn

  # ============================================
  # Weekly Quiz Generation Schedule
  # ============================================
  QuizGenerationScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ai-timeline-quiz-schedule-${Environment}
      Description: Triggers weekly quiz generation on Friday at 10 AM Eastern (2:00 PM UTC)
      # Friday 10 AM EDT = 2:00 PM UTC (3:00 PM UTC during EST/winter)
      ScheduleExpression: "cron(0 14 ? * FRI *)"
      State: ENABLED
      Targets:
        - Id: QuizGenerationLambdaTarget
          Arn: !GetAtt IngestionFunction.Arn
          Input: '{"action": "generateQuiz", "questionCount": 5, "daysBack": 7}'

  # Permission for EventBridge to invoke the Lambda for quiz generation
  QuizGenerationSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref IngestionFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt QuizGenerationScheduleRule.Arn

  # ============================================
  # Weekly Google Search Console Ingest
  # ============================================
  GscWeeklyIngestRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ai-timeline-gsc-schedule-${Environment}
      Description: Triggers weekly Google Search Console ingest
      ScheduleExpression: "cron(0 6 ? * MON *)"
      State: ENABLED
      Targets:
        - Id: GscWeeklyIngestLambdaTarget
          Arn: !GetAtt IngestionFunction.Arn
          Input: '{"action":"gscWeeklyIngest"}'

  GscWeeklyIngestPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref IngestionFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt GscWeeklyIngestRule.Arn

  # ============================================
  # Weekly SEO Digest
  # ============================================
  SeoWeeklyDigestRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ai-timeline-seo-digest-schedule-${Environment}
      Description: Triggers weekly SEO digest after Google Search Console ingest
      ScheduleExpression: "cron(15 13 ? * MON *)"
      State: ENABLED
      Targets:
        - Id: SeoWeeklyDigestLambdaTarget
          Arn: !GetAtt IngestionFunction.Arn
          Input: '{"action":"seoWeeklyDigest"}'

  SeoWeeklyDigestPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref IngestionFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SeoWeeklyDigestRule.Arn

  # ============================================
  # Alerting - SNS Topic + CloudWatch Alarms
  # ============================================
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ai-timeline-alerts-${Environment}
      DisplayName: AI Timeline Alerts

  AlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Sub '{{resolve:ssm:/ai-timeline/${Environment}/alert-email}}'

  # Alarm: Ingestion Lambda errors (covers both scheduled ingestion + quiz generation)
  IngestionLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ai-timeline-ingestion-errors-${Environment}
      AlarmDescription: Ingestion Lambda errors - includes quiz generation and news ingestion failures
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref IngestionFunction
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

  # Alarm: Quiz generation metric filter - catches "Quiz generation FAILED" in logs
  QuizGenerationFailureMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref IngestionFunctionLogGroup
      FilterPattern: '"Quiz generation FAILED"'
      MetricTransformations:
        - MetricName: QuizGenerationFailures
          MetricNamespace: !Sub AITimeline/${Environment}
          MetricValue: '1'
          DefaultValue: 0

  QuizGenerationFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ai-timeline-quiz-generation-failed-${Environment}
      AlarmDescription: Weekly quiz generation failed - check CloudWatch logs for details
      Namespace: !Sub AITimeline/${Environment}
      MetricName: QuizGenerationFailures
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

  # NOTE: WAF can be added later after initial deployment
  # For now, API Gateway throttling provides rate limiting

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub ai-timeline-api-endpoint-${Environment}

  ApiId:
    Description: API Gateway ID
    Value: !Ref ApiGateway
    Export:
      Name: !Sub ai-timeline-api-id-${Environment}

  FunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt ApiFunction.Arn
    Export:
      Name: !Sub ai-timeline-function-arn-${Environment}

  IngestionFunctionArn:
    Description: Ingestion Lambda function ARN
    Value: !GetAtt IngestionFunction.Arn
    Export:
      Name: !Sub ai-timeline-ingestion-arn-${Environment}

  IngestionScheduleRuleArn:
    Description: EventBridge schedule rule ARN
    Value: !GetAtt IngestionScheduleRule.Arn
    Export:
      Name: !Sub ai-timeline-ingestion-schedule-arn-${Environment}

  QuizGenerationScheduleRuleArn:
    Description: Weekly quiz generation EventBridge rule ARN
    Value: !GetAtt QuizGenerationScheduleRule.Arn
    Export:
      Name: !Sub ai-timeline-quiz-schedule-arn-${Environment}
